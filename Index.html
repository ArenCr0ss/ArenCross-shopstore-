<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arencross-shopstore | CD. JUÁREZ, CHIH.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0f0f11', pink: '#ec4899', pinkdark: '#db2777', light: '#f8fafc' }
                    }
                }
            }
        }
    </script>
    <style>.hide-scrollbar::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-brand-light text-brand-dark font-sans antialiased min-h-screen flex flex-col justify-between pb-20 overflow-x-hidden">

    <!-- HEADER -->
    <header class="bg-brand-dark sticky top-0 z-40 shadow-md">
        <div class="max-w-5xl mx-auto px-2.5 py-2 flex items-center justify-between gap-1.5">
            <div class="flex items-center gap-1.5 cursor-pointer select-none shrink-0" id="admin-trigger">
                <div class="bg-brand-pink text-white w-8 h-8 rounded-lg flex items-center justify-center font-black text-base shadow">A</div>
                <div class="leading-tight">
                    <h1 class="text-white font-black text-xs tracking-tight">Arencross<span class="text-brand-pink">-shopstore</span></h1>
                    <p class="text-[9px] text-pink-300 font-medium"><i class="fa-solid fa-location-dot"></i> CD. JUÁREZ, CHIH.</p>
                </div>
            </div>
            <div class="flex-1 min-w-0 max-w-[170px] sm:max-w-xs">
                <div class="relative flex items-center">
                    <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="Buscar..." class="w-full bg-white text-brand-dark text-[11px] rounded-lg pl-2.5 pr-6 py-1 focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute right-2 text-gray-400 text-[10px]"></i>
                </div>
            </div>
            <button onclick="toggleCart()" class="relative bg-zinc-800 text-white p-2 rounded-lg flex items-center shrink-0">
                <i class="fa-solid fa-cart-shopping text-brand-pink text-sm"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-brand-pink text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
        <div class="bg-zinc-900 border-t border-zinc-800 px-2.5 py-1">
            <div class="max-w-5xl mx-auto flex items-center gap-1.5 overflow-x-auto hide-scrollbar text-[11px] text-gray-300 whitespace-nowrap">
                <button onclick="filterCategory('todos')" class="text-brand-pink font-bold py-0.5 px-2 rounded bg-zinc-800">Todo</button>
                <button onclick="filterCategory('Mallas')" class="hover:text-brand-pink py-0.5 px-1.5">Mallas</button>
                <button onclick="filterCategory('Tenis Hombre')" class="hover:text-brand-pink py-0.5 px-1.5">Tenis Hombre</button>
                <button onclick="filterCategory('Tenis Mujer')" class="hover:text-brand-pink py-0.5 px-1.5">Tenis Mujer</button>
                <button onclick="filterCategory('Playeras Hombre')" class="hover:text-brand-pink py-0.5 px-1.5">Playeras Hombre</button>
            </div>
        </div>
    </header>

    <!-- CATÁLOGO -->
    <main class="max-w-5xl mx-auto px-2.5 py-3 flex-1 w-full">
        <div class="flex justify-between items-center mb-2.5">
            <h2 id="current-category-title" class="text-sm font-extrabold text-brand-dark">Catálogo Exclusivo</h2>
            <span class="text-[9px] text-gray-500 font-semibold bg-white px-2 py-0.5 rounded-full shadow-sm">México</span>
        </div>
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5"></div>
    </main>

    <!-- BOTÓN WHATSAPP FLOTANTE -->
    <a id="floating-whatsapp-btn" href="https://wa.me/15756548307?text=Hola%20Arencross-shopstore,%20tengo%20una%20duda%20sobre%20sus%20productos." target="_blank"
       class="fixed bottom-4 right-3 z-40 bg-emerald-500 hover:bg-emerald-600 text-white w-11 h-11 rounded-full shadow-xl flex items-center justify-center text-xl transition transform hover:scale-105">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- MODAL PEQUEÑO DE PIN (1234) -->
    <div id="pin-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-xl w-full max-w-[230px] p-3 shadow-2xl text-xs text-center">
            <p class="font-black text-brand-dark mb-1.5"><i class="fa-solid fa-lock text-brand-pink"></i> PIN Admin</p>
            <input type="password" id="pin-input" maxlength="6" placeholder="1234" class="w-full border rounded-lg px-2 py-1.5 text-center font-bold tracking-widest mb-2 text-xs">
            <div class="flex gap-1.5">
                <button type="button" onclick="closePinModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-1.5 rounded-lg text-[11px]">Cancelar</button>
                <button type="button" onclick="verifyPin()" class="flex-1 bg-brand-pink text-white font-bold py-1.5 rounded-lg text-[11px]">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PRODUCTO COMPACTO -->
    <div id="product-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-xl w-full max-w-[300px] p-3 relative shadow-2xl text-xs">
            <button onclick="closeProductModal()" class="absolute top-2 right-2 text-gray-500 bg-gray-100 w-6 h-6 rounded-full font-bold text-[11px]">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- PANEL ADMIN COMPACTO -->
    <div id="admin-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-2 overflow-y-auto">
        <div class="bg-white rounded-xl w-full max-w-[300px] p-2.5 relative shadow-2xl my-auto text-[11px] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-1.5 pb-1 border-b">
                <h3 class="font-black text-xs text-brand-dark"><i class="fa-solid fa-lock text-brand-pink"></i> Admin Arencross</h3>
                <button onclick="closeAdminPanel()" class="text-gray-500 font-bold text-sm px-1.5">✕</button>
            </div>

            <!-- WhatsApp del dueño -->
            <div class="mb-2 pb-1.5 border-b bg-gray-50 p-1.5 rounded-lg">
                <label class="block font-bold text-gray-700 text-[10px] mb-1">WhatsApp de Ventas:</label>
                <div class="flex gap-1">
                    <input type="text" id="admin-wa-input" class="flex-1 border rounded px-1.5 py-1 text-[11px] font-mono min-w-0">
                    <button type="button" onclick="saveWhatsappNumber()" class="bg-emerald-600 text-white px-2 py-1 rounded text-[10px] font-bold shrink-0">Guardar</button>
                </div>
            </div>

            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-1.5">
                <input type="hidden" id="prod-id">
                <div class="flex justify-between items-center">
                    <span id="form-mode-label" class="font-black text-brand-pink text-[10px]">Nuevo Producto</span>
                    <button type="button" onclick="resetForm()" class="text
