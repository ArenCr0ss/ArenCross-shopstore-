<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arencross-shopstore | CD. JUÁREZ, CHIH.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0f0f11', pink: '#ec4899', pinkdark: '#db2777', light: '#f8fafc' }
                    }
                }
            }
        }
    </script>
    <style>.hide-scrollbar::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-brand-light text-brand-dark font-sans antialiased min-h-screen flex flex-col justify-between pb-24">

    <!-- HEADER -->
    <header class="bg-brand-dark sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 cursor-pointer select-none" id="admin-trigger">
                <div class="bg-brand-pink text-white w-9 h-9 rounded-xl flex items-center justify-center font-black text-lg shadow-lg">A</div>
                <div>
                    <h1 class="text-white font-black text-sm tracking-tight">Arencross<span class="text-brand-pink">-shopstore</span></h1>
                    <p class="text-[10px] text-pink-300 font-medium"><i class="fa-solid fa-location-dot"></i> CD. JUÁREZ, CHIH.</p>
                </div>
            </div>
            <div class="flex-1 max-w-xs mx-1">
                <div class="relative flex items-center">
                    <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="Buscar..." class="w-full bg-white text-brand-dark text-xs rounded-lg pl-3 pr-7 py-1.5 focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute right-2.5 text-gray-400 text-xs"></i>
                </div>
            </div>
            <button onclick="toggleCart()" class="relative bg-zinc-800 text-white p-2 rounded-xl flex items-center">
                <i class="fa-solid fa-cart-shopping text-brand-pink text-base"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-brand-pink text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
        <div class="bg-zinc-900 border-t border-zinc-800 px-3 py-1.5">
            <div class="max-w-7xl mx-auto flex items-center gap-2 overflow-x-auto hide-scrollbar text-xs text-gray-300 whitespace-nowrap">
                <button onclick="filterCategory('todos')" class="text-brand-pink font-bold py-0.5 px-2 rounded bg-zinc-800">Todo</button>
                <button onclick="filterCategory('Mallas')" class="hover:text-brand-pink py-0.5 px-2">Mallas</button>
                <button onclick="filterCategory('Tenis Hombre')" class="hover:text-brand-pink py-0.5 px-2">Tenis Hombre</button>
                <button onclick="filterCategory('Tenis Mujer')" class="hover:text-brand-pink py-0.5 px-2">Tenis Mujer</button>
                <button onclick="filterCategory('Playeras Hombre')" class="hover:text-brand-pink py-0.5 px-2">Playeras Hombre</button>
            </div>
        </div>
    </header>

    <!-- CATÁLOGO -->
    <main class="max-w-7xl mx-auto px-3 py-4 flex-1 w-full">
        <div class="flex justify-between items-center mb-3">
            <h2 id="current-category-title" class="text-base font-extrabold text-brand-dark">Catálogo Exclusivo</h2>
            <span class="text-[10px] text-gray-500 font-semibold bg-white px-2 py-0.5 rounded-full shadow-sm">México</span>
        </div>
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </main>

    <!-- BOTÓN WHATSAPP FLOTANTE ELEVADO -->
    <a href="https://wa.me/52165656548307?text=Hola%20Arencross-shopstore,%20tengo%20una%20duda." target="_blank"
       class="fixed bottom-20 right-4 z-40 bg-emerald-500 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center text-2xl">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- MODAL PRODUCTO -->
    <div id="product-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl max-w-sm w-full p-4 relative shadow-2xl">
            <button onclick="closeProductModal()" class="absolute top-3 right-3 text-gray-500 bg-gray-100 w-7 h-7 rounded-full font-bold">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- PANEL ADMIN COMPACTO -->
    <div id="admin-modal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-2 overflow-y-auto">
        <div class="bg-white rounded-xl w-full max-w-xs p-3 relative shadow-2xl my-auto text-xs">
            <div class="flex justify-between items-center mb-2 pb-1.5 border-b">
                <h3 class="font-black text-sm text-brand-dark"><i class="fa-solid fa-lock text-brand-pink"></i> Admin Arencross</h3>
                <button onclick="closeAdminPanel()" class="text-gray-500 font-bold text-base px-2">✕</button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)" class="space-y-2">
                <input type="hidden" id="prod-id">
                <div>
                    <label class="block font-bold text-gray-700 text-[11px]">Nombre</label>
                    <input type="text" id="prod-name" required class="w-full border rounded px-2 py-1 text-xs">
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <div>
                        <label class="block font-bold text-gray-700 text-[11px]">Categoría</label>
                        <select id="prod-cat" class="w-full border rounded px-1 py-1 text-xs bg-white">
                            <option value="Mallas">Mallas</option>
                            <option value="Tenis Hombre">Tenis Hombre</option>
                            <option value="Tenis Mujer">Tenis Mujer</option>
                            <option value="Playeras Hombre">Playeras Hombre</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-700 text-[11px]">Precio ($ MXN)</label>
                        <input type="number" id="prod-price" required class="w-full border rounded px-2 py-1 text-xs">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 text-[11px]">Foto (Galería o Link)</label>
                    <input type="file" id="prod-file" accept="image/*" onchange="convertImageFile(this)" class="w-full text-[11px] mb-1">
                    <input type="text" id="prod-img" placeholder="O pega link" class="w-full border rounded px-2 py-1 text-[11px]">
                </div>
                <div>
                    <label class="block font-bold text-gray-700 text-[11px]">Descripción</label>
                    <input type="text" id="prod-desc" class="w-full border rounded px-2 py-1 text-xs">
                </div>
                <div class="flex gap-1.5 pt-1">
                    <button type="submit" class="flex-1 bg-brand-pink text-white font-bold py-1.5 rounded text-xs">Guardar</button>
                    <button type="button" onclick="resetForm()" class="bg-gray-200 text-gray-700 px-2.5 py-1.5 rounded text-xs font-bold">Limpiar</button>
                </div>
            </form>
            <div class="mt-3 pt-2 border-t">
                <h4 class="font-bold text-gray-800 text-[11px] mb-1">Tus Productos:</h4>
                <div id="admin-product-list" class="space-y-1 max-h-28 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- CARRITO MODAL -->
    <div id="cart-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-3 overflow-y-auto">
        <div class="bg-white rounded-2xl w-full max-w-sm p-4 relative shadow-2xl my-auto text-xs">
            <button onclick="toggleCart()" class="absolute top-3 right-3 text-gray-500 bg-gray-100 w-7 h-7 rounded-full font-bold">✕</button>
            <h3 class="text-sm font-black mb-2 text-brand-dark"><i class="fa-solid fa-cart-shopping text-brand-pink"></i> Tu Carrito</h3>
            <div id="cart-items" class="divide-y max-h-32 overflow-y-auto mb-2"></div>
            <div class="bg-gray-50 p-2.5 rounded-xl mb-2 border">
                <p class="font-bold text-[11px] mb-1"><i class="fa-solid fa-truck-fast text-brand-pink"></i> Envío SkydropX (México)</p>
                <div class="flex gap-1.5">
                    <input type="text" id="postal-code" placeholder="CP (Ej. 32000)" maxlength="5" class="flex-1 border rounded px-2 py-1 text-xs">
                    <button onclick="calculateShipping()" class="bg-zinc-800 text-white px-2.5 py-1 rounded text-xs font-bold">Cotizar</button>
                </div>
                <div id="shipping-result" class="mt-1 text-[10px]"></div>
            </div>
            <div class="border-t pt-2 space-y-0.5 mb-2">
                <div class="flex justify-between"><span>Subtotal:</span><span id="cart-subtotal">$0 MXN</span></div>
                <div class="flex justify-between"><span>Envío:</span><span id="cart-shipping-cost">$0 MXN</span></div>
                <div class="flex justify-between text-sm font-black pt-1 border-t"><span>Total:</span><span id="cart-total" class="text-brand-pink">$0 MXN</span></div>
            </div>
            <div class="mb-3">
                <p class="font-bold text-[11px] mb-1">Pago Nacional (MXN):</p>
                <div class="grid grid-cols-3 gap-1.5 mb-2">
                    <button type="button" onclick="selectPayment('tarjeta')" id="pay-tarjeta" class="p-1.5 border-2 border-brand-pink bg-pink-50 rounded-lg text-[10px] font-bold">Tarjeta</button>
                    <button type="button" onclick="selectPayment('spei')" id="pay-spei" class="p-1.5 border-2 border-gray-200 rounded-lg text-[10px] font-bold">SPEI</button>
                    <button type="button" onclick="selectPayment('oxxo')" id="pay-oxxo" class="p-1.5 border-2 border-gray-200 rounded-lg text-[10px] font-bold">OXXO</button>
                </div>
                <div id="spei-info-box" class="hidden bg-pink-50 border border-pink-200 p-2 rounded-lg text-[11px]">
                    <p class="font-bold text-brand-pink">CLABE SPEI:</p>
                    <p class="font-mono bg-white p-1 rounded border select-all font-bold text-center">721180100034025723</p>
                </div>
            </div>
            <button onclick="checkoutOrder()" class="w-full bg-brand-pink text-white font-bold py-2.5 rounded-xl shadow-lg flex items-center justify-center gap-1.5 text-xs">
                <i class="fa-brands fa-whatsapp text-base"></i> Confirmar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('arencross_products')) || [
            { id: 1, name: 'Malla Deportiva Pro', cat: 'Mallas', price: 450, img: 'https://images.unsplash.com/photo-1506152983158-b4a74a01c721?w=500', desc: 'Alta resistencia.' },
            { id: 2, name: 'Tenis Running Hombre', cat: 'Tenis Hombre', price: 1199, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500', desc: 'Comodidad máxima.' },
            { id: 3, name: 'Tenis Plataforma Mujer', cat: 'Tenis Mujer', price: 980, img: 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500', desc: 'Diseño ligero.' },
            { id: 4, name: 'Playera Algodón Hombre', cat: 'Playeras Hombre', price: 320, img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500', desc: '100% transpirable.' }
        ];

        let cart = [], currentCategory = 'todos', selectedPaymentMethod = 'tarjeta', shippingCost = 0;
        const WHATSAPP_NUMBER = '52165656548307';

        let clickCount = 0;
        document.getElementById('admin-trigger').addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 3) { clickCount = 0; let pin = prompt("PIN Administrador:"); if (pin === "1234") openAdminPanel(); }
            setTimeout(() => { clickCount = 0; }, 1000);
        });

        function renderProducts(list = products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            if (list.length === 0) { grid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400 text-xs">Sin productos.</div>`; return; }
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-lg shadow-sm border overflow-hidden flex flex-col justify-between">
                        <div onclick="openProductModal(${p.id})" class="cursor-pointer">
                            <img src="${p.img}" class="w-full h-32 object-cover bg-gray-100">
                            <div class="p-2">
                                <span class="text-[9px] font-bold text-brand-pink bg-pink-50 px-1.5 py-0.5 rounded">${p.cat}</span>
                                <h3 class="font-bold text-xs mt-1 line-clamp-1">${p.name}</h3>
                                <p class="text-sm font-black mt-1">$${p.price.toLocaleString()} <span class="text-[10px] font-normal text-gray-500">MXN</span></p>
                            </div>
                        </div>
                        <div class="p-2 pt-0"><button onclick="addToCart(${p.id})" class="w-full bg-brand-dark text-white font-bold py-1.5 rounded text-[11px]">+ Agregar</button></div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.getElementById('current-category-title').innerText = cat === 'todos' ? 'Catálogo Exclusivo' : cat;
            renderProducts(cat === 'todos' ? products : products.filter(p => p.cat === cat));
        }

        function searchProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)));
        }

        function convertImageFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas'), maxW = 400;
                        const scale = maxW / img.width;
                        canvas.width = maxW; canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        document.getElementById('prod-img').value = canvas.toDataURL('image/jpeg', 0.6);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openAdminPanel() { document.getElementById('admin-modal').classList.remove('hidden'); renderAdminList(); }
        function closeAdminPanel() { document.getElementById('admin-modal').classList.add('hidden'); resetForm(); }
        function resetForm() { document.getElementById('product-form').reset(); document.getElementById('prod-id').value = ''; }

        function renderAdminList() {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-1.5 rounded border">
                        <div class="flex items-center gap-1.5 overflow-hidden">
                            <img src="${p.img}" class="w-7 h-7 object-cover rounded">
                            <div class="truncate"><p class="font-bold text-[11px] truncate">${p.name}</p><p class="text-[9px] text-gray-500">$${p.price}</p></div>
                        </div>
                        <div class="flex gap-1">
                            <button type="button" onclick="editProduct(${p.id})" class="bg-blue-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold">Editar</button>
                            <button type="button" onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-1.5 py-0.5 rounded text-[9px] font-bold">X</button>
                        </div>
                    </div>
                `;
            });
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value;
            const cat = document.getElementById('prod-cat').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const img = document.getElementById('prod-img').value || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500';
            const desc = document.getElementById('prod-desc').value;

            if (id) {
                const idx = products.findIndex(p => p.id == id);
                if (idx !== -1) products[idx] = { id: Number(id), name, cat, price, img, desc };
            } else {
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, name, cat, price, img, desc });
            }

            try {
                localStorage.setItem('arencross_products', JSON.stringify(products));
                renderProducts(); renderAdminList(); resetForm(); alert("¡Guardado exitoso!");
            } catch (err) { alert("Imagen muy pesada, usa otra o un enlace."); }
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (p) {
                document.getElementById('prod-id').value = p.id;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-cat').value = p.cat;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-img').value = p.img;
                document.getElementById('prod-desc').value = p.desc;
            }
        }

        function deleteProduct(id) {
            if (confirm("¿Eliminar producto?")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('arencross_products', JSON.stringify(products));
                renderProducts(); renderAdminList();
            }
        }

        function openProductModal(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            document.getElementById('modal-content').innerHTML = `
                <img src="${p.img}" class="w-full h-44 object-cover rounded-xl mb-2">
                <span class="text-[10px] font-bold text-brand-pink bg-pink-50 px-2 py-0.5 rounded">${p.cat}</span>
                <h2 class="text-base font-black mt-1">${p.name}</h2>
                <p class="text-lg font-black mt-1">$${p.price.toLocaleString()} MXN</p>
                <p class="text-xs text-gray-600 mt-1">${p.desc || ''}</p>
                <div class="mt-3 space-y-1.5">
                    <button onclick="addToCart(${p.id}); closeProductModal(); toggleCart();" class="w-full bg-brand-pink text-white font-bold py-2 rounded-lg text-xs">Comprar Ahora</button>
                    <a href="https://wa.me/${WHATSAPP_NUMBER}?text=Hola,%20me%20interesa:%20${encodeURIComponent(p.name)}%20($${p.price}MXN)" target="_blank" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg text-xs flex items-center justify-center gap-1.5">
                        <i class="fa-brands fa-whatsapp"></i> Preguntar por WhatsApp
                    </a>
                </div>
            `;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function toggleCart() { const m = document.getElementById('cart-modal'); m.classList.toggle('hidden'); if (!m.classList.contains('hidden')) renderCartItems(); }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            const e = cart.find(item => item.id === id);
            if (e) e.qty++; else cart.push({ ...p, qty: 1 });
            document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0);
        }

        function renderCartItems() {
            const c = document.getElementById('cart-items'); c.innerHTML = '';
            if (cart.length === 0) { c.innerHTML = `<div class="text-center py-3 text-gray-400">Carrito vacío</div>`; document.getElementById('cart-subtotal').innerText = '$0 MXN'; document.getElementById('cart-total').innerText = `$${shippingCost} MXN`; return; }
            let sub = 0;
            cart.forEach(i => {
                sub += i.price * i.qty;
                c.innerHTML += `<div class="py-1.5 flex items-center justify-between"><div class="flex items-center gap-2"><img src="${i.img}" class="w-8 h-8 object-cover rounded"><div><p class="font-bold line-clamp-1">${i.name}</p><p class="text-[10px] text-gray-500">$${i.price} x ${i.qty}</p></div></div><button onclick="removeFromCart(${i.id})" class="text-red-500 font-bold px-1">X</button></div>`;
            });
            document.getElementById('cart-subtotal').innerText = `$${sub.toLocaleString()} MXN`;
            document.getElementById('cart-shipping-cost').innerText = `$${shippingCost.toLocaleString()} MXN`;
            document.getElementById('cart-total').innerText = `$${(sub + shippingCost).toLocaleString()} MXN`;
        }

        function removeFromCart(id) { cart = cart.filter(i => i.id !== id); renderCartItems(); document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0); }

        function calculateShipping() {
            const cp = document.getElementById('postal-code').value, res = document.getElementById('shipping-result');
            if (cp.length !== 5) { res.innerHTML = `<span class="text-red-500 font-bold">CP inválido.</span>`; return; }
            shippingCost = cp.startsWith('32') ? 90 : 180;
            res.innerHTML = `<span class="text-emerald-600 font-bold">✓ SkydropX: $${shippingCost} MXN</span>`;
            renderCartItems();
        }

        function selectPayment(m) {
            selectedPaymentMethod = m;
            ['tarjeta', 'spei', 'oxxo'].forEach(x => {
                document.getElementById(`pay-${x}`).className = x === m ? "p-1.5 border-2 border-brand-pink bg-pink-50 rounded-lg text-[10px] font-bold" : "p-1.5 border-2 border-gray-200 rounded-lg text-[10px] font-bold";
            });
            document.getElementById('spei-info-box').classList.toggle('hidden', m !== 'spei');
        }

        function checkoutOrder() {
            if (cart.length === 0) return alert("Carrito vacío.");
            let sub = cart.reduce((s, i) => s + (i.price * i.qty), 0), tot = sub + shippingCost;
            let items = cart.map(i => `• ${i.qty}x ${i.name} ($${i.price * i.qty})`).join('\n');
            let msg = `¡Hola! Pedido en *Arencross-shopstore*:\n\n${items}\n\nTotal: *$${tot} MXN*\nPago: *${selectedPaymentMethod.toUpperCase()}*` + (selectedPaymentMethod === 'spei' ? `\nCLABE: 721180100034025723` : '');
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
